:underline;text-underline-offset:4px}.availability-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #444;padding:12px 0;gap:10px}.availability-form{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.availability-form label{display:flex;flex-direction:column;gap:6px}.availability-form input,.availability-form select{padding:9px;border-radius:7px;background:#10141b;color:#fff;border:1px solid #555}.availability-form button{align-self:end}@media(max-width:750px){.team-page-grid{grid-template-columns:1fr}}.player-profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}.player-mmr-row{display:flex;justify-content:space-between;gap:20px;padding:13px 0;border-bottom:1px solid #3c3c3c}.player-name-button{background:none;border:0;color:#eac15f;text-decoration:underline;cursor:pointer;padding:3px}.player-name-button:hover{color:#fff}@media(max-width:750px){.player-profile-grid{grid-template-columns:1fr}}.player-tracker-button{display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:13px 18px;background:#25211a;border:1px solid #d6a64b;border-radius:9px;color:#f2c16b;text-decoration:none;font-weight:700}.player-tracker-button:hover{background:#393020;color:#ffe3a4}
/* Playoffs V26 */
.po-wrap{overflow-x:auto;padding:12px 0 20px}.po-grid{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;min-width:1020px}.po-col{display:flex;flex-direction:column;gap:14px}.po-head{color:var(--gold);font-weight:900;font-size:17px;padding:10px 4px;border-bottom:2px solid #a8782c}.po-head.lower{color:#e07166;border-color:#a53b34}.po-match{border:1px solid #775d32;background:linear-gradient(130deg,#202020,#111317);border-radius:10px;padding:12px;min-height:132px}.po-match.pending{opacity:.8}.po-match .po-label{font-size:11px;color:#d3b47a;margin-bottom:9px}.po-team{display:flex;justify-content:space-between;align-items:center;gap:7px;border-bottom:1px solid #3d3b37;padding:7px 0}.po-team:last-of-type{border:0}.po-team.winner{color:#eac06b;font-weight:900}.po-team .po-score{font-weight:900;font-size:17px}.po-team .po-tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.po-edit{font-size:12px;padding:5px 9px;margin-top:9px}.po-help{color:#cbb98f;font-size:13px}.po-lower{margin-top:26px}.po-grand{border:2px solid #c18c37;background:linear-gradient(130deg,#3b2912,#151515)}.po-original{max-width:100%;border:1px solid #76542c;border-radius:10px}.po-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:500px}.po-form label{font-size:13px}.po-form input{max-width:160px}.po-form button{align-self:end}.po-editor{margin:16px 0;padding:18px;border:1px solid #755d35;border-radius:10px;background:#181a1d}

/* V27 : chemins de progression des playoffs, sans changement des résultats. */
.po-stage-scroll{overflow-x:auto;padding:12px 2px 26px}
.po-stage{position:relative;min-width:1280px;padding:10px 12px 22px;isolation:isolate}
.po-stage .po-grid{grid-template-columns:repeat(4,minmax(255px,1fr));gap:90px;min-width:0}
.po-stage .po-col{gap:20px}
.po-stage .po-match{position:relative;z-index:2;min-height:130px;background:linear-gradient(130deg,#202020,#111317)}
.po-stage .po-head{position:relative;z-index:2;background:#101215}
.po-stage .po-upper-grid .po-col:nth-child(2),.po-stage .po-upper-grid .po-col:nth-child(3),.po-stage .po-upper-grid .po-col:nth-child(4){justify-content:space-around}
.po-stage .po-lower-grid .po-col:nth-child(3),.po-stage .po-lower-grid .po-col:nth-child(4){justify-content:space-around}
.po-stage .po-lower{position:relative;z-index:2;margin-top:85px;margin-bottom:12px;background:#101215;display:inline-block;padding:6px 15px;border-left:3px solid #c64b45}
.po-paths{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.po-legend{display:flex;flex-wrap:wrap;gap:20px;color:#c8c8c8;font-size:13px;margin:10px 0 15px}
.po-legend span:before{content:'';display:inline-block;width:28px;border-top:3px solid var(--route);vertical-align:middle;margin-right:8px}
.po-stage .po-match[data-po-id]:hover{border-color:#f4c767;box-shadow:0 0 0 1px #d4aa52}

/* V28 : disposition du tableau d'origine, liaisons sobres sans croisements. */
.po-stage{min-width:1340px;padding:12px 14px 35px}
.po-stage .po-grid{grid-template-columns:repeat(4,minmax(235px,1fr));gap:65px}
.po-stage .po-col{gap:12px;justify-content:flex-start!important}
.po-stage .po-head{font-size:15px;text-transform:uppercase;min-height:40px}
.po-stage .po-match{min-height:108px;padding:9px 12px}
.po-stage .po-team{padding:5px 0}
.po-stage .po-upper-grid{height:590px}
.po-stage .po-upper-grid .po-col:nth-child(1) .po-match{margin-bottom:0}
.po-stage .po-upper-grid .po-col:nth-child(2) .po-match:first-of-type{margin-top:68px}
.po-stage .po-upper-grid .po-col:nth-child(2) .po-match:nth-of-type(2){margin-top:115px}
.po-stage .po-upper-grid .po-col:nth-child(3) .po-match{margin-top:166px}
.po-stage .po-upper-grid .po-col:nth-child(4) .po-match{margin-top:280px}
.po-stage .po-lower{margin-top:0;margin-bottom:14px}
.po-stage .po-lower-grid{height:310px}
/* V40 : la hauteur des colonnes suit les cartes, y compris les boutons de replay. */
.po-stage .po-upper-grid,.po-stage .po-lower-grid{height:auto;min-height:0;align-items:start}
.po-stage .po-col{min-width:0}
.po-stage .po-match{height:auto;box-sizing:border-box}
.po-stage .po-lower{clear:both}
.po-stage .po-lower-grid .po-col:nth-child(3) .po-match{margin-top:55px}
.po-stage .po-lower-grid .po-col:nth-child(4) .po-match{margin-top:55px}
.po-stage .po-paths{z-index:1}
/* V29 : adapter toute la largeur du bracket à l'écran, sans rogner la finale. */
.po-stage-scroll{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden}
.po-stage{width:1340px;min-width:1340px;transform-origin:top left}

/* V30 : seuls les noms des équipes dans les playoffs ouvrent leur fiche. */
.po-team-link{appearance:none;background:transparent;border:0;border-radius:3px;color:inherit;padding:0;text-align:left;font:inherit;min-width:0;cursor:pointer;}
.po-team-link:hover,.po-team-link:focus-visible{color:var(--gold);text-decoration:underline;outline-offset:3px;}

/* V34 : affichage en liste des rencontres uniquement */
.v4-match-list .v4-vs{color:#e9bc66;font-size:12px;margin:0 10px}
.v4-match-list{display:flex;flex-direction:column;gap:8px;width:100%}
.v4-match-list .v4-result{display:grid;grid-template-columns:minmax(130px,0.8fr) minmax(240px,2fr) minmax(90px,0.5fr) minmax(145px,0.9fr);align-items:center;gap:16px;padding:12px 18px;border-radius:8px}
.v4-match-list .v4-result small{font-size:12px}
.v4-match-list .v4-result h3{margin:0;font-size:15px;line-height:1.35}
.v4-match-list .v4-result h3 br{display:none}
.v4-match-list .v4-result h3 br+br{display:none}
.v4-match-list .v4-result h3{word-spacing:4px}
.v4-match-list .v4-score{font-size:21px;white-space:nowrap}
.v4-match-list .v4-source{justify-self:end;text-align:right}
@media(max-width:720px){.v4-match-list .v4-result{grid-template-columns:1fr auto;gap:8px 12px}.v4-match-list .v4-result small{grid-column:1/-1}.v4-match-list .v4-source{grid-column:1/-1;justify-self:start;text-align:left}}

/* V35 : interface de préparation des imports de replays, sans analyse serveur. */
.replay-trigger{padding:7px 11px;font-size:12px;white-space:nowrap}
.replay-panel{grid-column:1/-1;border-top:1px solid #48413a;padding-top:15px;margin-top:3px}
.replay-panel h4{color:var(--gold);margin:0 0 10px}
.replay-panel p{font-size:13px;margin:8px 0}
.replay-panel input[type=file]{max-width:500px;margin:8px 0}
.replay-pill{display:inline-block;border:1px solid #685634;border-radius:20px;color:#e7bf74;padding:5px 10px;font-size:12px;margin:4px 7px 4px 0}
.replay-panel .replay-info{color:#c3c8cf}

/* V36 : envoi authentifié et suivi des replays sur Supabase */
.replay-auth{margin:12px 0;padding:13px;border:1px solid #5c4a2c;border-radius:9px;background:#171716}
.replay-auth input{max-width:360px;margin:8px 8px 8px 0}
.replay-cloud-item{padding:8px 0;border-bottom:1px solid #393939;font-size:13px;color:#dfcda6}
.replay-panel{grid-column:1/-1}
.replay-panel button:disabled{opacity:.55;cursor:wait}

.header-account{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}

.header-connected span{font-size:13px;max-width:175px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f1cb82;font-weight:700}
.header-connected button{font-size:12px;padding:8px}
@media(max-width:750px){.header-account{width:100%;justify-content:flex-start}.header-connected span{max-width:140px}}

ay-info">Les replays envoyés sont conservés dans un stockage privé. L'analyse et le calcul automatique des résultats seront connectés ultérieurement. Les classements actuels ne changent pas.</p></section>`;

function replaySelectFiles(event,key){
 const incoming=Array.from(event.target.files||[]),current=replayPendingFiles[key]||[];
 for(const f of incoming){
  if(!/\.replay$/i.test(f.name)){alert('Seuls les fichiers .replay sont acceptés.');continue;}
  if(f.size===0||f.size>25000000){alert('Fichier vide ou supérieur à 25 Mo : '+f.name);continue;}
  if(current.some(x=>x.name===f.name&&x.size===f.size&&x.lastModified===f.lastModified))continue;
  current.push(f);
 }
 replayPendingFiles[key]=current;render();
}
function replayRemoveFile(key,i){if(!replayPendingFiles[key])return;replayPendingFiles[key].splice(i,1);render()}

 if(error){alert('Impossible de lire les replays : '+replayError(error));return;}

async function replaySha256(file){const bytes=await file.arrayBuffer(),hash=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function replayUpload(key){
 if(replayBusy)return;
 if(!replayClient||!replayCurrentUser()){alert('Connecte-toi avant l’envoi.');return;}
 const files=replayPendingFiles[key]||[];if(!files.length)return;
 const match=key.startsWith('playoffs|')?poIds.map(playoffReplayMatch).find(m=>m&&playoffReplayKey(m.playoffId)===key):allRealMatches().find(m=>replayMatchKey(m)===key);if(!match){alert('Rencontre introuvable.');return;}if(match.playoffId&&!replayCanUpload(match)){alert('Tu ne peux importer que pour les rencontres de ton équipe.');return;}
 replayBusy=true;render();let sent=0;let errors=[];
 try{
  for(const file of [...files]){
   try{
    const digest=await replaySha256(file),user=replayCurrentUser();if(!user)throw Error('Session expirée');
    const path=`${user.id}/${crypto.randomUUID()}.replay`;
    const upload=await replayClient.storage.from('championship-replays').upload(path,file,{contentType:'application/octet-stream',upsert:false});
    if(upload.error)throw upload.error;
    const row=await replayClient.from('championship_replays').insert({match_key:key,week:match.week,uploader_id:user.id,storage_path:path,file_sha256:digest,original_filename:file.name,file_size:file.size,status:'pending_analysis'});
    if(row.error){if(row.error.code==='23505')throw Error('Replay déjà enregistré pour cette rencontre');throw row.error;}
    const ix=replayPendingFiles[key]?.indexOf(file)??-1;if(ix>=0)replayPendingFiles[key].splice(ix,1);
    sent++;
   }catch(err){errors.push(file.name+' : '+replayError(err));}
  }
 }finally{replayBusy=false;await replayRefresh(key);render();}
 alert(sent+' replay(s) enregistré(s).'+(errors.length?'\nÉchecs :\n'+errors.join('\n'):''));
}

}

function poDrawRoutes(){
 const stage=document.querySelector('.po-stage'),svg=document.querySelector('.po-paths');
 if(!stage||!svg)return;
 // Ajuster l'ensemble du tableau à la largeur disponible avant de tracer les lignes.
 const wrapper=stage.closest('.po-stage-scroll');
 const naturalWidth=1340;
 const available=Math.max(1,wrapper.clientWidth-4);
 const factor=Math.min(1,available/naturalWidth);
 stage.style.zoom=String(factor);

 const r0=stage.getBoundingClientRect(),width=stage.scrollWidth,height=stage.scrollHeight;
 svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
 svg.setAttribute('width',width);svg.setAttribute('height',height);
 const pt=(id,side)=>{const e=stage.querySelector(`[data-po-id="${id}"]`);if(!e)return null;const r=e.getBoundingClientRect();return {x:((side==='right'?r.right:r.left)-r0.left)/factor,y:(r.top-r0.top+r.height/2)/factor}};
 const segments=[];
 for(const [from,to,level] of poRoutes){
  const a=pt(from,'right'),b=pt(to,'left');if(!a||!b)continue;
  // La finale Lower rejoint la grande finale par le bas, sans traverser l'Upper.
  let d;
  if(level==='lower'&&to==='gf'){
   const x=a.x+Math.max(14,(b.x-a.x)*.45);
   d=`M ${a.x} ${a.y} H ${x} V ${b.y} H ${b.x}`;
  }else{
   const mid=a.x+(b.x-a.x)*.48;
   d=`M ${a.x} ${a.y} H ${mid} V ${b.y} H ${b.x}`;
  }
  segments.push(`<path d="${d}" stroke="${level==='upper'?'#e3b65e':'#d44d49'}" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
 }
 svg.innerHTML=segments.join('');
}

function renderPlayoffs(){const m=poCompute();requestAnimationFrame(poDrawRoutes);return `<h1>🏅 Playoffs — Saison 1</h1>${admin?`<div class="v4-note">Tableau interactif basé sur le bracket original de la saison 1. Les équipes avancent automatiquement dès qu'un résultat est enregistré.${admin?' Mode administration : saisis les scores avec les boutons des rencontres.':' Résultats modifiables en mode administration uniquement.'} Les modifications sont enregistrées uniquement dans ce navigateur.</div>`:''}${poEditor(m)}<div class="po-stage-scroll"><div class="po-stage"><svg class="po-paths" aria-hidden="true"></svg><h2>🟡 Upper Bracket</h2><div class="po-grid po-upper-grid">${poColumn('Quarts de finale',['uq1','uq2','uq3','uq4'],m)}${poColumn('Demi-finales',['us1','us2'],m)}${poColumn('Finale Upper',['uf'],m)}${poColumn('Grande finale',['gf'],m)}</div><h2 class="po-lower">🔴 Lower Bracket</h2><div class="po-grid po-lower-grid">${poColumn('Round 1',['lr1','lr2'],m,true)}${poColumn('Round 2',['lr3','lr4'],m,true)}${poColumn('Demi-finale',['ls'],m,true)}${poColumn('Finale Lower',['lf'],m,true)}</div></div></div>${renderPlayoffReplayPanel(m)}${admin?`<details class="card"><summary style="cursor:pointer;color:var(--gold);font-weight:800">Afficher l'image originale des playoffs</summary><p>Document d'origine fourni dans l'archive saison 1.</p><img class="po-original" src="assets/extra_73.webp" alt="Tableau original des playoffs saison 1"></details><p class="po-help">Le classement du championnat et les résultats des semaines 1 à 7 ne sont pas modifiés par les playoffs.</p>`:''}`}
window.addEventListener('resize',()=>{if(document.querySelector('.po-stage'))requestAnimationFrame(poDrawRoutes)});


function renderV4(which){const standing=v4Standings(),played=allRealMatches().filter(m=>m.sa!==null).length;
const notice=admin?`<div class="v4-note">🏆 Saison 1 réelle · ${played} résultats structurés · Semaines 1 à 5 reconstituées depuis les visuels. Barème appliqué : victoire 3 points, nul 1 point, défaite 0.</div>`:'';
if(which==='Tournois')return `<h1>🏆 Raze Championship — Saison 1</h1>${notice}<div class="v4-statbar"><div><strong>${teamNames.length}</strong><br>équipes</div><div><strong>${played}</strong><br>matchs saisis</div><div><strong>7</strong><br>semaines documentées</div></div><div class="card"><h2>Championnat en cours</h2><p>Les rencontres et résultats sont maintenant intégrés aux onglets Matchs, Équipes et Classements.</p><button onclick="go('Matchs')">Consulter les matchs</button> <button onclick="go('Classements')">Voir le classement</button></div>`;
if(which==='Équipes')return `<h1>👥 Équipes de la saison 1</h1><p class="v4-source">Toutes les équipes de la saison sont affichées. Clique sur « Voir l'équipe » pour accéder à sa fiche, aux joueurs et aux disponibilités.</p><div class="v4-grid">${teamNames.map((t,i)=>`<div class="v4-result"><h3>${esc(displayTeam(t))}</h3><button type="button" onclick="openTeamPage(${i})">👥 Voir l'équipe →</button></div>`).join('')}</div>`;
if(which==='Matchs')return `<h1>📅 Matchs — Saison 1</h1>${notice}${v4Results()}`;
if(which==='Classements')return `<h1>📊 Classements — Saison 1</h1>${notice}<h2>Classement des équipes</h2><div class="v4-filter"><button class="${rankingMetric==='manches'?'selected':''}" onclick="rankingToggle('manches')">🎮 Manches</button><button class="${rankingMetric==='buts'?'selected':''}" onclick="rankingToggle('buts')">⚽ Buts</button></div>${rankingMetric==='buts'?'<p class="v4-note">⚽ Totaux cumulés des semaines 1 à 7 : 28 rencontres × 4 manches. Les semaines 6 et 7 proviennent des nouvelles captures de résultats. Les résultats ajoutés sans détail des manches ne sont pas inclus dans ces totaux de buts.</p>':''}<div class="card v4-scroll"><table class="v4-table"><tr><th>#</th><th>Équipe</th><th>J</th><th>V</th><th>N</th><th>D</th><th>${rankingMetric==='manches'?'Manches +':'Buts marqués'}</th><th>${rankingMetric==='manches'?'Manches −':'Buts encaissés'}</th><th>Diff.</th><th>Pts*</th></tr>${standing.map((t,i)=>{const g=goalsSeason[t.name];const a=rankingMetric==='manches'?t.pf:g?.for;const b=rankingMetric==='manches'?t.pc:g?.against;return `<tr><td>${i+1}</td><td>${esc(displayTeam(t.name))}</td><td>${t.j}</td><td>${t.v}</td><td>${t.n}</td><td>${t.d}</td><td>${a??'—'}</td><td>${b??'—'}</td><td>${a!=null&&b!=null?(a-b>0?'+':'')+(a-b):'—'}</td><td><b>${t.pts}</b></td></tr>`}).join('')}</table></div>${rankingMetric==='buts'?`<details class="card"><summary>📋 Vérifier les 28 rencontres utilisées pour le calcul</summary><div class="v4-scroll"><table class="v4-table"><tr><th>Sem.</th><th>Rencontre</th><th>Scores des 4 manches (A–B)</th><th>Buts A</th><th>Buts B</th></tr>${goalsByMatch.map(m=>`<tr><td>${m.week}</td><td>${esc(displayTeam(m.a))} / ${esc(displayTeam(m.b))}</td><td>${m.games.map(g=>g.join('–')).join(' · ')}</td><td>${m.games.reduce((n,g)=>n+g[0],0)}</td><td>${m.games.reduce((n,g)=>n+g[1],0)}</td></tr>`).join('')}</table></div></details>`:''}<h2>Statistiques individuelles réelles</h2>${v4Stats()}`;
if(which==='Brackets')return renderPlayoffs();
if(which==='Administration')return `<h1>👑 Administration · Saison 1</h1><div class="v4-note">Les modifications sont enregistrées uniquement sur cet appareil et ne sont pas partagées entre visiteurs. Le mode administrateur n’est pas encore sécurisé.</div><div class="card"><h2>➕ Créer une équipe complète</h2><p>Crée une équipe avec son nom et ses joueurs. Un pseudo par ligne (ou séparé par une virgule). Elle apparaîtra immédiatement dans l’onglet Équipes et dans les listes administrateur. Aucune rencontre n’est créée automatiquement.</p><form onsubmit="createCompleteTeam(event)"><label>Nom de l’équipe<input class="v4-admininput" name="teamName" type="text" maxlength="60" required placeholder="Nom de la nouvelle équipe"></label><label>Joueurs<textarea name="members" rows="5" required placeholder="Joueur 1&#10;Joueur 2&#10;Joueur 3" style="width:100%;background:#11151b;color:white;border:1px solid #555;border-radius:8px;padding:12px"></textarea></label><button class="primary" type="submit">+ Créer l’équipe avec ses joueurs</button></form></div><div class="card"><h2>✏️ Renommer une équipe</h2><p>Modifie le nom affiché dans les équipes, les matchs, les classements et l’administration. Les résultats et les membres restent rattachés à la même équipe. Les modifications sont enregistrées sur cet appareil.</p><form onsubmit="renameTeam(event)"><label>Équipe<select name="originalTeam" required>${teamNames.map(t=>`<option value="${esc(t)}">${esc(displayTeam(t))}</option>`).join('')}</select></label><label>Nouveau nom<input class="v4-admininput" name="newTeamName" type="text" maxlength="60" required placeholder="Nouveau nom de l’équipe"></label><button class="primary" type="submit">Enregistrer le nouveau nom</button></form></div><div class="card"><h2>👥 Gérer les membres des équipes</h2><p>Ajouter un joueur à une équipe de la saison 1. Les changements sont enregistrés uniquement dans ce navigateur.</p><form onsubmit="addTeamMember(event)"><label>Équipe<select name="team" required>${teamNames.map(t=>`<option value="${esc(t)}">${esc(displayTeam(t))}</option>`).join('')}</select></label><label>Pseudo du joueur<input class="v4-admininput" name="member" type="text" maxlength="60" required placeholder="Pseudo du joueur"></label><button class="primary" type="submit">+ Ajouter le membre</button></form><h3>Membres actuellement affichés</h3>${teamNames.map((t,ti)=>`<details style="margin:8px 0"><summary>${esc(displayTeam(t))} (${seasonRosters[t].length})</summary>${seasonRosters[t].map((n,ni)=>`<div class="roster-member">${esc(n)} <button type="button" onclick="removeTeamMember(${ti},${ni})">Retirer</button></div>`).join('')||'<p>Aucun membre.</p>'}</details>`).join('')}</div><div class="card"><h2>Ajouter un résultat / programmer un match</h2><p>Les semaines 1 à 7 sont enregistrées. Les résultats ajoutés ici restent locaux à ton navigateur et ne modifient pas les données de référence de la saison.</p><form onsubmit="v4Add(event)"><label>Semaine<select name="week">${[6,7,8,9,10].map(w=>`<option value="${w}">${w}</option>`).join('')}</select></label><label>Équipe A<select name="a">${teamNames.map(t=>`<option value="${esc(t)}">${esc(displayTeam(t))}</option>`).join('')}</select></label><label>Équipe B<select name="b">${teamNames.map(t=>`<option value="${esc(t)}">${esc(displayTeam(t))}</option>`).join('')}</select></label><label>Score A (vide = à jouer)<input name="sa" type="number" min="0" class="v4-admininput" placeholder="Non joué"></label><label>Score B (vide = à jouer)<input name="sb" type="number" min="0" class="v4-admininput" placeholder="Non joué"></label><button class="primary" type="submit">Ajouter le résultat</button></form></div><div class="card"><h2>Rencontres ajoutées localement</h2>${customMatches.map((m,i)=>`<p>S${m.week} · ${esc(displayTeam(m.a))} ${m.sa??'—'} - ${m.sb??'—'} ${esc(displayTeam(m.b))} <button onclick="customMatches.splice(${i},1);saveV4();render()">Supprimer</button></p>`).join('')||'<p>Aucune rencontre ajoutée.</p>'}</div>`;
return ''}
function v4Add(e){e.preventDefault();const f=new FormData(e.target),a=f.get('a'),b=f.get('b'),sa=f.get('sa'),sb=f.get('sb');if(a===b){alert('Choisis deux équipes différentes.');return}if((sa==='')!==(sb==='')){alert('Renseigne les deux scores ou laisse les deux vides.');return}customMatches.push({week:Number(f.get('week')),a,b,sa:sa===''?null:Number(sa),sb:sb===''?null:Number(sb),source:''});saveV4();render()}

// Premier affichage après la déclaration des données.
render();
</script></body></html>
