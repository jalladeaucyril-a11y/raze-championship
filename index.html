const teamNames=['Black Horizon','Dynasty','Dunk Master','Cordon Bleu Penders','Eclipse','Origin','Pause Café','Trinity'];
let v4Week='Toutes',v4Stat='buts';
let customMatches=JSON.parse(localStorage.getItem('raze_s1_added_matches')||'[]');
// La progression est calculée depuis les rencontres prévues (sans compter les ajouts en double).
function effectiveScheduled(m){const update=customMatches.filter(x=>x.week===m.week&&x.a===m.a&&x.b===m.b&&x.sa!==null&&x.sb!==null).at(-1);return update?{...m,sa:update.sa,sb:update.sb,status:'Validé (démo locale)'}:m}
function allRealMatches(){return realMatches.concat(scheduledMatches.map(effectiveScheduled),customMatches.filter(x=>!scheduledMatches.some(m=>m.week===x.week&&m.a===x.a&&m.b===x.b)))}
function weekComplete(w){const matches=allRealMatches().filter(m=>m.week===w);return matches.length===4&&matches.every(m=>Number.isFinite(m.sa)&&Number.isFinite(m.sb))}
function weekUnlocked(w){if(admin)return true;if(w<=1)return true;for(let n=1;n<w;n++){if(!weekComplete(n))return false}return true}
function selectMatchWeek(w){v4Week=w;render()}
function selectArchiveWeek(w){activeWeek=w;render()}
function lockedWeekMessage(w){return `<div class="card" style="border:1px solid #a77c35"><h2>🔒 Semaine ${w} verrouillée</h2><p>Les affiches seront dévoilées lorsque tous les matchs de la semaine ${w-1} auront un résultat enregistré.</p><p>Les onglets de toutes les semaines restent visibles.</p></div>`}

function saveV4(){localStorage.setItem('raze_s1_added_matches',JSON.stringify(customMatches))}
function v4Standings(){let r=Object.fromEntries(teamNames.map(n=>[n,{name:n,j:0,v:0,n:0,d:0,pf:0,pc:0,pts:0}]));allRealMatches().forEach(m=>{if(m.sa===null||m.sb===null)return;for(const [t,sc,against] of [[m.a,m.sa,m.sb],[m.b,m.sb,m.sa]]){if(!r[t])r[t]={name:t,j:0,v:0,n:0,d:0,pf:0,pc:0,pts:0};let x=r[t];x.j++;x.pf+=sc;x.pc+=against;if(sc>against){x.v++;x.pts+=3}else if(sc===against){x.n++;x.pts++}else x.d++}});return Object.values(r).sort((a,b)=>b.pts-a.pts||(b.pf-b.pc)-(a.pf-a.pc)||b.pf-a.pf)}
function v4Results(){const shown=v4Week!=='Toutes'&&!weekUnlocked(Number(v4Week))?[]:allRealMatches().filter(m=>(v4Week==='Toutes'||String(m.week)===String(v4Week))&&weekUnlocked(m.week));return `<div class="v4-filter">${['Toutes',1,2,3,4,5,6,7].map(w=>`<button class="${String(w)===String(v4Week)?'selected':''}" onclick="selectMatchWeek('${w}')" title="${w!=='Toutes'&&!weekUnlocked(Number(w))?'Termine la semaine précédente pour voir les affiches':''}">${w==='Toutes'?'Toutes les semaines':(weekUnlocked(Number(w))?'':'🔒 ')+'Semaine '+w}</button>`).join('')}</div>${v4Week!=='Toutes'&&!weekUnlocked(Number(v4Week))?lockedWeekMessage(v4Week):`<div class="v4-grid">${shown.map(m=>`<article class="v4-result"><small>Semaine ${m.week} · ${m.sa===null?'À jouer · BO4':'Résultat enregistré'}</small><h3>${esc(m.a)}<br>VS<br>${esc(m.b)}</h3><div class="v4-score">${m.sa===null?'À jouer · BO4':m.sa+' — '+m.sb}</div>${m.source?`<a class="v4-source" href="${m.source}" target="_blank" rel="noopener">Voir la feuille de résultat ↗</a>`:''}</article>`).join('')||'<div class="card">Aucune rencontre enregistrée pour cette semaine.</div>'}</div>`}`}
function v4Stats(){let data=realStats[v4Stat]||[];return `<div class="v4-filter">${[['buts','Buteurs'],['passes','Passeurs'],['arrêts','Gardiens / arrêts'],['mvp','Moyennes MVP']].map(([id,label])=>`<button class="${id===v4Stat?'selected':''}" onclick="v4Stat='${id}';render()">${label}</button>`).join('')}</div><div class="card v4-scroll"><table class="v4-table"><tr><th>#</th><th>Joueur</th><th>${v4Stat==='mvp'?'Moyenne':'Total'}</th></tr>${data.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td><b>${p.value}</b></td></tr>`).join('')}</table><p class="v4-source">Données issues des fichiers ODS fournis. Les statistiques ne sont pas rattachées à une équipe lorsqu'aucune correspondance fiable n'est disponible.</p></div>`}

const seasonRosters={"Black Horizon": ["Skyfox_277_", "FlasH_SkiPy", "Locbyze"], "Dynasty": ["Ashito Yoichi", "Akaioh", "S7t_"], "Cordon Bleu Penders": ["Gogs", "Gagadinho", "Ad3l"], "Dunk Master": ["C'LMTH", "MONST3R", "jhonbedo1979"], "Origin": ["Nimoxt.", "Zax", "LzAto"], "Eclipse": ["reynnz.", "Asuko97", "Pierico_"], "Pause Café": ["IIII", "Iluminha", "ADTiX"], "Trinity": ["Santaury_", "HASBIIII", "Motara"]};
function toggleRoster(key){const el=document.getElementById('roster-'+key);if(el)el.hidden=!el.hidden;}
function renderV4(which){const standing=v4Standings(),played=allRealMatches().filter(m=>m.sa!==null).length;
const notice=`<div class="v4-note">🏆 Saison 1 réelle · ${played} résultats structurés · Semaines 1 à 5 vérifiées sur les visuels. Barème provisoire : victoire 3 points, nul 1 point, défaite 0. À confirmer avec ton règlement avant utilisation officielle.</div>`;
if(which==='Tournois')return `<h1>🏆 Raze Championship — Saison 1</h1>${notice}<div class="v4-statbar"><div><strong>${teamNames.length}</strong><br>équipes</div><div><strong>${played}</strong><br>matchs saisis</div><div><strong>7</strong><br>semaines documentées</div></div><div class="card"><h2>Championnat en cours</h2><p>Les rencontres et résultats sont maintenant intégrés aux onglets Matchs, Équipes et Classements.</p><button onclick="go('Matchs')">Consulter les matchs</button> <button onclick="go('Classements')">Voir le classement</button></div>`;
if(which==='Équipes')return `<h1>👥 Équipes de la saison 1</h1><p class="v4-source">Clique sur une équipe pour consulter les joueurs identifiés sur les captures de la semaine 1. Les compositions peuvent avoir évolué depuis.</p><div class="v4-grid">${teamNames.map(t=>`<div class="v4-result"><h3>${esc(t)}</h3><button type="button" onclick="toggleRoster('${encodeURIComponent(t)}')">👥 Voir les membres</button><div class="team-roster" id="roster-${encodeURIComponent(t)}" hidden>${(seasonRosters[t]||[]).map(n=>`<div class="roster-member">🎮 ${esc(n)}</div>`).join('')||'<p>Composition non confirmée</p>'}</div></div>`).join('')}</div><p class="v4-source">Source : captures d'écran des matchs de la semaine 1. Ces noms ne constituent pas une liste officielle actuelle des inscrits.</p>`;
if(which==='Matchs')return `<h1>📅 Matchs — Saison 1</h1>${notice}${v4Results()}`;
if(which==='Classements')return `<h1>📊 Classements — Saison 1</h1>${notice}<h2>Classement des équipes (calcul provisoire)</h2><div class="card v4-scroll"><table class="v4-table"><tr><th>#</th><th>Équipe</th><th>J</th><th>V</th><th>N</th><th>D</th><th>Manches +</th><th>Manches −</th><th>Diff.</th><th>Pts*</th></tr>${standing.map((t,i)=>`<tr><td>${i+1}</td><td>${esc(t.name)}</td><td>${t.j}</td><td>${t.v}</td><td>${t.n}</td><td>${t.d}</td><td>${t.pf}</td><td>${t.pc}</td><td>${t.pf-t.pc}</td><td><b>${t.pts}</b></td></tr>`).join('')}</table></div><h2>Statistiques individuelles réelles</h2>${v4Stats()}`;
if(which==='Brackets')return `<h1>🏅 Playoffs — Saison 1</h1><div class="v4-note">Le tableau des playoffs original est conservé. Aucune qualification ni rencontre de playoffs n'est inventée.</div><div class="card"><h2>Tableau d'origine</h2><p>Consulte le document fourni pour confirmer les affiches et résultats avant de les transformer en bracket modifiable.</p><button onclick="go('Saison 1')">Voir les documents sources</button></div>`;
if(which==='Administration')return `<h1>👑 Administration · Saison 1</h1><div class="v4-note">⚠️ Mode démo local uniquement : les résultats ajoutés sont enregistrés dans CE navigateur. Ils ne sont PAS partagés avec les autres visiteurs, ni synchronisés avec GitHub/Vercel. Pas de contrôle d'accès réel.</div><div class="card"><h2>Ajouter un résultat / programmer un match</h2><p>Pour débloquer la semaine 7 côté joueur, saisis les résultats des quatre rencontres de la semaine 6 en sélectionnant exactement les équipes prévues. Ce déblocage reste local à ton navigateur.</p><form onsubmit="v4Add(event)"><label>Semaine<select name="week">${[6,7,8,9,10].map(w=>`<option value="${w}">${w}</option>`).join('')}</select></label><label>Équipe A<select name="a">${teamNames.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><label>Équipe B<select name="b">${teamNames.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><label>Score A (vide = à jouer)<input name="sa" type="number" min="0" class="v4-admininput" placeholder="Non joué"></label><label>Score B (vide = à jouer)<input name="sb" type="number" min="0" class="v4-admininput" placeholder="Non joué"></label><button class="primary" type="submit">Ajouter à ma démo</button></form></div><div class="card"><h2>Rencontres ajoutées localement</h2>${customMatches.map((m,i)=>`<p>S${m.week} · ${esc(m.a)} ${m.sa??'—'} - ${m.sb??'—'} ${esc(m.b)} <button onclick="customMatches.splice(${i},1);saveV4();render()">Supprimer</button></p>`).join('')||'<p>Aucune rencontre ajoutée.</p>'}</div>`;
return ''}
function v4Add(e){e.preventDefault();const f=new FormData(e.target),a=f.get('a'),b=f.get('b'),sa=f.get('sa'),sb=f.get('sb');if(a===b){alert('Choisis deux équipes différentes.');return}if((sa==='')!==(sb==='')){alert('Renseigne les deux scores ou laisse les deux vides.');return}customMatches.push({week:Number(f.get('week')),a,b,sa:sa===''?null:Number(sa),sb:sb===''?null:Number(sb),source:''});saveV4();render()}
