<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raze Championship — Aperçu interactif</title><style>:root{--bg:#090b0e;--panel:#15191e;--gold:#d6ad55;--silver:#b9c0ca;--line:#343940}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0%,#29251b 0%,#0b0d10 48%,#070809 100%);color:#f3f1ec;font:15px system-ui,Arial,sans-serif;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between;padding:20px 4%;border-bottom:1px solid #4a402b;background:#0b0d10e8;gap:15px;flex-wrap:wrap}.brand{font-size:23px;font-weight:900;letter-spacing:2px;color:var(--gold)}.brand small{display:block;color:var(--silver);font-size:10px;letter-spacing:4px}nav{display:flex;gap:8px;flex-wrap:wrap}button,select,input,textarea{font:inherit}button{cursor:pointer;background:#22262b;color:white;border:1px solid #575049;border-radius:8px;padding:10px 14px}button:hover,button.active{border-color:var(--gold);color:var(--gold)}button.primary{background:linear-gradient(110deg,#9b742e,#d9b76c);color:#12110e;border:0;font-weight:800}main{max-width:1250px;margin:auto;padding:36px 24px}h1{font-size:clamp(30px,5vw,55px);margin:8px 0 12px}h2{color:var(--gold);margin-top:0}p{color:#c5c7c9;line-height:1.6}.eyebrow{color:var(--gold);letter-spacing:3px;text-transform:uppercase;font-size:12px}.hero{border:1px solid #57482e;background:linear-gradient(130deg,#25221c,#101318);border-radius:18px;padding:42px 35px;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}.card{background:linear-gradient(145deg,#1b1e23,#101215);border:1px solid var(--line);border-radius:13px;padding:22px}.card strong{color:#fff;font-size:20px}.tag{display:inline-block;color:var(--gold);border:1px solid #685634;border-radius:20px;padding:4px 9px;font-size:12px;margin-bottom:12px}.muted{color:#aeb4bc}.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}input,select,textarea{background:#0b0e12;border:1px solid #50545a;color:#fff;border-radius:7px;padding:11px;width:100%;margin:7px 0 14px}label{display:block;color:var(--silver);font-size:13px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #35383c;padding:13px}th{color:var(--gold)}.notice{border:1px dashed #71603e;background:#211e17;padding:12px 16px;border-radius:8px;color:#e0ca95;margin:18px 0}.bracket{display:flex;gap:18px;align-items:center;overflow:auto;padding:20px 0}.round{min-width:205px}.match{background:#22262b;border:1px solid #56504a;padding:12px;margin:12px 0;border-radius:9px}.match b{color:var(--gold)}.stat{font-size:32px;font-weight:900;color:var(--gold)}footer{text-align:center;padding:28px;color:#92969a;border-top:1px solid #333}.switch{background:#30291b;border-color:var(--gold)}@media(max-width:650px){header{padding:16px}main{padding:20px 12px}.hero{padding:25px 20px}nav button{padding:8px}}
.season-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px}.season-item{display:flex;flex-direction:column;gap:8px;color:#e5d1a3;text-decoration:none;border:1px solid #4d4535;border-radius:9px;padding:10px;background:#101317}.season-item:hover{border-color:var(--gold)}.season-item img{width:100%;height:220px;object-fit:contain;background:#08090b;border-radius:5px}.season-item span{overflow-wrap:anywhere;font-size:13px}</style></head><body><header><div class="brand">RAZE <span style="color:#eee">CHAMPIONSHIP</span><small>RAZE ESPORT</small></div><nav id="nav"></nav><button id="adminToggle" onclick="toggleAdmin()">👑 Mode admin : OFF</button></header><main><div class="notice">APERÇU INTERACTIF LOCAL — données fictives de démonstration. Aucun compte Discord, serveur ou base de données connecté.</div><div id="view"></div></main><footer>RAZE CHAMPIONSHIP · Un seul compte, trois univers, une même communauté</footer><script>
const pages=['Accueil','Tournois','Équipes','Matchs','Brackets','Classements','Profil','Saison 1','Administration'];let page='Accueil',admin=false;let tournaments=[{name:'Raze Open — Saison 1',mode:'2v2',format:'Double élimination',status:'Inscriptions ouvertes',players:16},{name:'Raze League',mode:'3v3',format:'Championnat',status:'À venir',players:8},{name:'Raze Duel Cup',mode:'1v1',format:'Élimination directe',status:'En cours',players:32}];let teams=['RAZE Alpha','Nova Esport','Silver Fox','Golden Boost'];let matches=[{a:'RAZE Alpha',b:'Nova Esport',score:'2 - 1',status:'Validé'},{a:'Silver Fox',b:'Golden Boost',score:'—',status:'À jouer'}];const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function go(p){page=p;render()}function toggleAdmin(){admin=!admin;if(!admin&&page==='Administration')page='Accueil';render()}function render(){ $('adminToggle').textContent='👑 Mode admin : '+(admin?'ON':'OFF');$('adminToggle').className=admin?'switch':'';$('nav').innerHTML=pages.filter(p=>p!=='Administration'||admin).map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('');let html='';switch(page){case 'Accueil':html=`<section class="hero"><div class="eyebrow">Compétitions Rocket League</div><h1>LA COMPÉTITION<br><span style="color:var(--gold)">COMMENCE ICI.</span></h1><p>Tournois, championnats, qualifications et classements : l'univers compétitif Raze Esport.</p><div class="row"><button class="primary" onclick="go('Tournois')">Explorer les tournois →</button><button onclick="go('Brackets')">Voir les brackets</button></div></section><div class="grid"><div class="card"><div class="stat">${tournaments.length}</div><p>Compétitions de démonstration</p></div><div class="card"><div class="stat">${teams.length}</div><p>Équipes fictives</p></div><div class="card"><div class="stat">${matches.length}</div><p>Matchs d'exemple</p></div></div>`;break;case 'Tournois':html=`<div class="row space"><h1>🏆 Tournois</h1>${admin?'<button class="primary" onclick="go(\'Administration\')">+ Créer un tournoi</button>':''}</div><div class="grid">${tournaments.map((t,i)=>`<div class="card"><span class="tag">${esc(t.status)}</span><h2>${esc(t.name)}</h2><p>${esc(t.mode)} · ${esc(t.format)}<br>${t.players} places prévues</p><button onclick="showInfo('Inscription')">Voir / s’inscrire</button></div>`).join('')}</div>`;break;case 'Équipes':html=`<h1>👥 Équipes</h1><div class="grid">${teams.map((t,i)=>`<div class="card"><span class="tag">Équipe #${i+1}</span><h2>${esc(t)}</h2><p>Composition et invitations : module prévu.</p><button onclick="showInfo('Gestion d’équipe')">Voir l’équipe</button></div>`).join('')}</div>`;break;case 'Matchs':html=`<h1>📅 Matchs</h1><div class="card"><table><tr><th>Rencontre</th><th>Score</th><th>Statut</th><th>Action</th></tr>${matches.map((m,i)=>`<tr><td>${esc(m.a)} vs ${esc(m.b)}</td><td>${esc(m.score)}</td><td>${esc(m.status)}</td><td><button onclick="showInfo('Résultat / litige')">Détails</button></td></tr>`).join('')}</table></div>`;break;case 'Brackets':html=`<h1>🏅 Brackets</h1><p>Exemple visuel d'un arbre de tournoi. Les vrais brackets dynamiques seront développés lors de la phase compétitions.</p><div class="bracket"><div class="round"><h2>Demi-finales</h2><div class="match">RAZE Alpha <b>2</b><hr>Nova Esport 1</div><div class="match">Silver Fox <b>3</b><hr>Golden Boost 0</div></div><div class="round"><h2>Finale</h2><div class="match">RAZE Alpha —<hr>Silver Fox —</div></div><div class="round"><h2>Champion</h2><div class="match">🏆 À déterminer</div></div></div>`;break;case 'Classements':html=`<h1>📊 Classements</h1><div class="row"><button onclick="setRanking('1v1')">1v1</button><button onclick="setRanking('2v2')">2v2</button><button onclick="setRanking('3v3')">3v3</button></div><div id="ranking" class="card" style="margin-top:15px"></div>`;break;case 'Profil':html=`<h1>👤 Profil joueur</h1><div class="card"><span class="tag">Aperçu</span><h2>RAZE PLAYER</h2><p>La connexion Discord commune au Hub sera intégrée ultérieurement. Le pseudo et l'avatar affichés ici sont fictifs.</p><div class="grid"><div><div class="stat">0</div>Victoires</div><div><div class="stat">0</div>Tournois</div><div><div class="stat">0</div>Trophées</div></div></div>`;break;case 'Saison 1':html=renderSeason();break;case 'Administration':html=admin?`<h1>👑 Administration</h1><p>Mode démonstration : les modifications restent dans cette page et disparaissent au rechargement.</p><div class="grid"><div class="card"><h2>Créer un tournoi</h2><form onsubmit="createTournament(event)"><label>Nom du tournoi<input id="tName" required maxlength="80" placeholder="Ex. Raze Championship Cup"></label><label>Mode<select id="tMode"><option>1v1</option><option>2v2</option><option>3v3</option></select></label><label>Format<select id="tFormat"><option>Élimination directe</option><option>Double élimination</option><option>Championnat</option><option>Phases de groupes</option><option>Qualifications + phases finales</option></select></label><label>Nombre de places<input id="tPlaces" type="number" min="2" max="512" value="16" required></label><button class="primary" type="submit">Créer le tournoi test</button></form></div><div class="card"><h2>Gestion des compétitions</h2>${tournaments.map((t,i)=>`<p>${esc(t.name)} <button onclick="deleteTournament(${i})">Supprimer</button></p>`).join('')}<h2>Outils prévus</h2><p>Inscriptions, litiges, scores, organisateurs, récompenses, annonces, logs et permissions.</p></div></div>`:'';break;} $('view').innerHTML=html;if(page==='Classements')setRanking('2v2')}

[{"label": "Calendriers", "files": [{"name": "guiu.PNG", "url": "assets/extra_63.webp"}, {"name": "semain 3 barrer.png", "url": "assets/extra_64.webp"}, {"name": "semaine 1 fin png.png", "url": "assets/extra_65.webp"}, {"name": "semaine 1png.png", "url": "assets/extra_66.webp"}, {"name": "semaine 2.PNG", "url": "assets/extra_67.webp"}, {"name": "semaine 3.PNG", "url": "assets/extra_68.webp"}, {"name": "semaine 4.PNG", "url": "assets/extra_69.webp"}, {"name": "semaine 5.PNG", "url": "assets/extra_70.webp"}, {"name": "semaine 6.PNG", "url": "assets/extra_71.webp"}, {"name": "Semaine 7PNG.PNG", "url": "assets/extra_72.webp"}]}, {"label": "Playoffs", "files": [{"name": "abre 1.png", "url": "assets/extra_73.webp"}]}, {"label": "Statistiques finales", "files": [{"name": "buteur.png", "url": "assets/extra_74.webp"}, {"name": "gardien.png", "url": "assets/extra_75.webp"}, {"name": "mvp.png", "url": "assets/extra_76.webp"}, {"name": "passeur.png", "url": "assets/extra_77.webp"}]}, {"label": "MVP et statistiques", "files": [{"name": "arrets.PNG", "url": "assets/extra_78.webp"}, {"name": "goal.PNG", "url": "assets/extra_79.webp"}, {"name": "mvp.PNG", "url": "assets/extra_80.webp"}, {"name": "passeur.PNG", "url": "assets/extra_81.webp"}, {"name": "s1.PNG", "url": "assets/extra_82.webp"}, {"name": "S2.PNG", "url": "assets/extra_83.webp"}, {"name": "S3.PNG", "url": "assets/extra_84.webp"}, {"name": "S4.PNG", "url": "assets/extra_85.webp"}, {"name": "S5.PNG", "url": "assets/extra_86.webp"}, {"name": "S6.PNG", "url": "assets/extra_87.webp"}, {"name": "S7.PNG", "url": "assets/extra_88.webp"}]}];let activeWeek=7,seasonTab='semaines';function renderSeason(){let w=seasonData[activeWeek-1];return `<div class="row space"><div><div class="eyebrow">RAZE CHAMPIONSHIP · ARCHIVES</div><h1>🏆 Saison 1</h1><p>Documents réels fournis par l'organisateur · consultation et vérification</p></div><span class="tag">Import documentaire · données à confirmer</span></div><div class="notice">Les images proviennent de ton dossier d'origine. Les résultats ne sont pas encore transcrits en base de données : aucun classement automatique ni résultat inventé. Les commandes d'édition seront ajoutées après vérification des données.</div><div class="row" style="margin-bottom:18px"><button class="${seasonTab==='semaines'?'active':''}" onclick="seasonTab='semaines';render()">Semaines 1 à 7</button><button class="${seasonTab==='calendriers'?'active':''}" onclick="seasonTab='calendriers';render()">Calendriers</button><button class="${seasonTab==='playoffs'?'active':''}" onclick="seasonTab='playoffs';render()">Playoffs</button><button class="${seasonTab==='stats'?'active':''}" onclick="seasonTab='stats';render()">Statistiques</button></div>${seasonTab==='semaines'?`<div class="row" style="margin-bottom:20px">${seasonData.map(x=>`<button class="${activeWeek===x.number?'active':''}" onclick="activeWeek=${x.number};render()">Semaine ${x.number}</button>`).join('')}</div><div class="card"><h2>Semaine ${activeWeek}</h2><p>Source : ${esc(w.folder)} · ${w.files.length} documents visuels</p><div class="season-grid">${w.files.map(f=>seasonImage(f)).join('')}</div></div>`:seasonTab==='calendriers'?extraImages('Calendriers'):seasonTab==='playoffs'?extraImages('Playoffs'):extraImages('Statistiques finales')+extraImages('MVP et statistiques')}`};function extraImages(label){let g=seasonExtras.find(x=>x.label===label);return `<div class="card" style="margin-bottom:16px"><h2>${esc(label)}</h2><div class="season-grid">${g.files.map(f=>seasonImage(f)).join('')}</div></div>`}function seasonImage(f){return `<a class="season-item" href="${f.url}" target="_blank" rel="noopener"><img src="${f.url}" loading="lazy" alt="${esc(f.name)}"><span>${esc(f.name)} ↗</span></a>`}function setRanking(mode){$('ranking').innerHTML=`<h2>Classement ${mode} · Démonstration</h2><table><tr><th>Position</th><th>Équipe</th><th>Points fictifs</th></tr>${teams.map((t,i)=>`<tr><td>#${i+1}</td><td>${esc(t)}</td><td>${(4-i)*250}</td></tr>`).join('')}</table>`}function showInfo(feature){alert(feature+' : interface de démonstration. Fonctionnalité réelle prévue pour une prochaine phase.')}function createTournament(e){e.preventDefault();tournaments.unshift({name:$('tName').value,mode:$('tMode').value,format:$('tFormat').value,status:'Brouillon',players:Number($('tPlaces').value)});render();alert('Tournoi de démonstration créé. Consultez la page Tournois.')}function deleteTournament(i){if(confirm('Supprimer ce tournoi de démonstration ?')){tournaments.splice(i,1);render()}}render();
</script></body></html>
