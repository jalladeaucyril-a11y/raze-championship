function effectiveScheduled(m){const update=customMatches.filter(x=>x.week===m.week&&x.a===m.a&&x.b===m.b&&x.sa!==null&&x.sb!==null).at(-1);return update?{...m,sa:update.sa,sb:update.sb,status:'Validé (démo locale)'}:m}
function allRealMatches(){return realMatches.concat(scheduledMatches.map(effectiveScheduled),customMatches.filter(x=>!scheduledMatches.some(m=>m.week===x.week&&m.a===x.a&&m.b===x.b)))}

function createCompleteTeam(event){
 event.preventDefault();if(!admin)return;
 const f=event.currentTarget,name=f.elements.teamName.value.trim();
 const members=f.elements.members.value.split(/[,\n;]+/).map(x=>x.trim()).filter(Boolean);

 if(teamNames.some(t=>displayTeam(t).toLocaleLowerCase()===name.toLocaleLowerCase())){alert('Une équipe porte déjà ce nom.');return;}
 if(!members.length){alert('Ajoute au moins un joueur.');return;}
 if(members.some(n=>n.length>60)){alert('Un pseudo dépasse 60 caractères.');return;}
 if(new Set(members.map(n=>n.toLocaleLowerCase())).size!==members.length){alert('Un joueur est présent plusieurs fois.');return;}
 teamNames.push(name);createdTeams.push(name);seasonRosters[name]=members;
 try{localStorage.setItem(createdTeamsKey,JSON.stringify(createdTeams));saveRosters();}catch(e){alert('Impossible de sauvegarder localement : '+e.message);return;}
 render();alert('Équipe '+name+' créée avec '+members.length+' membre(s) dans cette démonstration locale.');
}

if(teamAvailabilities[t].some(x=>x.day===day&&x.start===start&&x.end===end)){alert('Ce créneau existe déjà.');return;}
teamAvailabilities[t].push({day,start,end});saveAvailability();render();}
function removeAvailability(i){const a=teamAvailabilities[selectedTeamId];if(!Array.isArray(a)||!a[i])return;a.splice(i,1);saveAvailability();render();}
function renderTeamPage(){const t=selectedTeamId;if(!teamNames.includes(t))return `<button onclick="go('Équipes')">Retour aux équipes</button>`;
const entries=Array.isArray(teamAvailabilities[t])?teamAvailabilities[t]:[];
return `<div class="team-breadcrumb"><button onclick="go('Équipes')">← Toutes les équipes</button> <span> / ${esc(displayTeam(t))}</span></div><h1>👥 ${esc(displayTeam(t))}</h1><div class="team-page-grid"><section class="card"><h2>Composition de l'équipe</h2><p class="v4-source">Clique sur un pseudo associé à un Tracker pour consulter ses statistiques Rocket League.</p>${teamPlayers(t).map(n=>`<div class="roster-member">🎮 <button class="player-name-button" data-player="${esc(n)}" onclick="openPlayerPage(this.dataset.player)">${esc(n)}</button></div>`).join('')||'<p>Aucun joueur enregistré.</p>'}<p class="v4-source">Compositions issues des captures et ajouts locaux ; à confirmer pour l'effectif actuel.</p></section><section class="card"><h2>📅 Disponibilités</h2><p class="v4-source">Créneaux d'équipe enregistrés dans ce navigateur uniquement. Les membres ne peuvent pas encore les synchroniser entre eux : connexion et base de données nécessaires.</p>${entries.length?entries.slice().sort((a,b)=>dayNames.indexOf(a.day)-dayNames.indexOf(b.day)||a.start.localeCompare(b.start)).map(x=>{const i=entries.indexOf(x);return `<div class="availability-row"><span><b>${esc(x.day)}</b> · ${esc(x.start)} à ${esc(x.end)}</span><button type="button" onclick="removeAvailability(${i})" aria-label="Supprimer le créneau">🗑️</button></div>`}).join(''):'<p>Aucune disponibilité renseignée.</p>'}<h3>Ajouter une disponibilité</h3><form onsubmit="addAvailability(event)" class="availability-form"><label>Jour<select name="day">${dayNames.map(d=>`<option>${d}</option>`).join('')}</select></label><label>De<input type="time" name="start" value="19:00" required></label><label>À<input type="time" name="end" value="22:00" required></label><button class="primary" type="submit">+ Ajouter ce créneau</button></form></section></div>`;
}

function renderV4(which){const standing=v4Standings(),played=allRealMatches().filter(m=>m.sa!==null).length;
const notice=`<div class="v4-note">🏆 Saison 1 réelle · ${played} résultats structurés · Semaines 1 à 5 reconstituées depuis les visuels. Barème provisoire : victoire 3 points, nul 1 point, défaite 0. À confirmer avec ton règlement avant utilisation officielle.</div>`;
if(which==='Tournois')return `<h1>🏆 Raze Championship — Saison 1</h1>${notice}<div class="v4-statbar"><div><strong>${teamNames.length}</strong><br>équipes</div><div><strong>${played}</strong><br>matchs saisis</div><div><strong>7</strong><br>semaines documentées</div></div><div class="card"><h2>Championnat en cours</h2><p>Les rencontres et résultats sont maintenant intégrés aux onglets Matchs, Équipes et Classements.</p><button onclick="go('Matchs')">Consulter les matchs</button> <button onclick="go('Classements')">Voir le classement</button></div>`;
if(which==='Équipes')return `<h1>👥 Équipes de la saison 1</h1><p class="v4-source">Toutes les équipes de la saison sont affichées. Clique sur « Voir l'équipe » pour accéder à sa fiche, aux joueurs et aux disponibilités.</p><div class="v4-grid">${teamNames.map((t,i)=>`<div class="v4-result"><h3>${esc(displayTeam(t))}</h3><button type="button" onclick="openTeamPage(${i})">👥 Voir l'équipe →</button></div>`).join('')}</div>`;
if(which==='Matchs')return `<h1>📅 Matchs — Saison 1</h1>${notice}${v4Results()}`;
if(which==='Classements')return `<h1>📊 Classements — Saison 1</h1>${notice}<h2>Classement des équipes (calcul provisoire)</h2><div class="v4-filter"><button class="${rankingMetric==='manches'?'selected':''}" onclick="rankingToggle('manches')">🎮 Manches</button><button class="${rankingMetric==='buts'?'selected':''}" onclick="rankingToggle('buts')">⚽ Buts</button></div>${rankingMetric==='buts'?'<p class="v4-note">⚽ Totaux cumulés des semaines 1 à 5 : 20 rencontres × 4 manches, relevées sur les visuels d’origine. Les résultats ajoutés ultérieurement sans détail des quatre manches ne sont pas inclus dans ces totaux de buts.</p>':''}<div class="card v4-scroll"><table class="v4-table"><tr><th>#</th><th>Équipe</th><th>J</th><th>V</th><th>N</th><th>D</th><th>${rankingMetric==='manches'?'Manches +':'Buts marqués'}</th><th>${rankingMetric==='manches'?'Manches −':'Buts encaissés'}</th><th>Diff.</th><th>Pts*</th></tr>${standing.map((t,i)=>{const g=goalsSeason[t.name];const a=rankingMetric==='manches'?t.pf:g?.for;const b=rankingMetric==='manches'?t.pc:g?.against;return `<tr><td>${i+1}</td><td>${esc(displayTeam(t.name))}</td><td>${t.j}</td><td>${t.v}</td><td>${t.n}</td><td>${t.d}</td><td>${a??'—'}</td><td>${b??'—'}</td><td>${a!=null&&b!=null?(a-b>0?'+':'')+(a-b):'—'}</td><td><b>${t.pts}</b></td></tr>`}).join('')}</table></div>${rankingMetric==='buts'?`<details class="card"><summary>📋 Vérifier les 20 feuilles de match utilisées pour le calcul</summary><div class="v4-scroll"><table class="v4-table"><tr><th>Sem.</th><th>Rencontre</th><th>Scores des 4 manches (A–B)</th><th>Buts A</th><th>Buts B</th></tr>${goalsByMatch.map(m=>`<tr><td>${m.week}</td><td>${esc(displayTeam(m.a))} / ${esc(displayTeam(m.b))}</td><td>${m.games.map(g=>g.join('–')).join(' · ')}</td><td>${m.games.reduce((n,g)=>n+g[0],0)}</td><td>${m.games.reduce((n,g)=>n+g[1],0)}</td></tr>`).join('')}</table></div></details>`:''}<h2>Statistiques individuelles réelles</h2>${v4Stats()}`;
if(which==='Brackets')return `<h1>🏅 Playoffs — Saison 1</h1><div class="v4-note">Le tableau des playoffs original est conservé. Aucune qualification ni rencontre de playoffs n'est inventée.</div><div class="card"><h2>Tableau d'origine</h2><p>Consulte le document fourni pour confirmer les affiches et résultats avant de les transformer en bracket modifiable.</p><button onclick="go('Saison 1')">Voir les documents sources</button></div>`;
if(which==='Administration')return `<h1>👑 Administration · Saison 1</h1><div class="v4-note">⚠️ Mode démo local uniquement : les résultats ajoutés sont enregistrés dans CE navigateur. Ils ne sont PAS partagés avec les autres visiteurs, ni synchronisés avec GitHub/Vercel. Pas de contrôle d'accès réel.</div><div class="card"><h2>➕ Créer une équipe complète</h2><p>Crée une équipe avec son nom et ses joueurs. Un pseudo par ligne (ou séparé par une virgule). Elle apparaîtra immédiatement dans l’onglet Équipes et dans les listes administrateur. Aucune rencontre n’est créée automatiquement.</p><form onsubmit="createCompleteTeam(event)"><label>Nom de l’équipe<input class="v4-admininput" name="teamName" type="text" maxlength="60" required placeholder="Nom de la nouvelle équipe"></label><label>Joueurs<textarea name="members" rows="5" required placeholder="Joueur 1&#10;Joueur 2&#10;Joueur 3" style="width:100%;background:#11151b;color:white;border:1px solid #555;border-radius:8px;padding:12px"></textarea></label><button class="primary" type="submit">+ Créer l’équipe avec ses joueurs</button></form></div><div class="card"><h2>✏️ Renommer une équipe</h2><p>Modifie le nom affiché dans les équipes, les matchs, les classements et l’administration. Les résultats et les membres restent rattachés à la même équipe. Démonstration locale uniquement.</p><form onsubmit="renameTeam(event)"><label>Équipe<select name="originalTeam" required>${teamNames.map(t=>`<option value="${esc(t)}">${esc(displayTeam(t))}</option>`).join('')}</select></label><label>Nouveau nom<input class="v4-admininput" name="newTeamName" type="text" maxlength="60" required placeholder="Nouveau nom de l’équipe"></label><button class="primary" type="submit">Enregistrer le nouveau nom</button></form></div><div class="card"><h2>👥 Gérer les membres des équipes</h2><p>Ajouter un joueur à une équipe de la saison 1. Les changements sont enregistrés uniquement dans ce navigateur.</p><form onsubmit="addTeamMember(event)"><label>Équipe<select name="team" required>${teamNames.map(t=>`<option value="${esc(t)}">${esc(displayTeam(t))}</option>`).join('')}</select></label><label>Pseudo du joueur<input class="v4-admininput" name="member" type="text" maxlength="60" required placeholder="Pseudo du joueur"></label><button class="primary" type="submit">+ Ajouter le membre</button></form><h3>Membres actuellement affichés</h3>${teamNames.map((t,ti)=>`<details style="margin:8px 0"><summary>${esc(displayTeam(t))} (${seasonRosters[t].length})</summary>${seasonRosters[t].map((n,ni)=>`<div class="roster-member">${esc(n)} <button type="button" onclick="removeTeamMember(${ti},${ni})">Retirer</button></div>`).join('')||'<p>Aucun membre.</p>'}</details>`).join('')}</div><div class="card"><h2>Ajouter un résultat / programmer un match</h2><p>Pour débloquer la semaine 7 côté joueur, saisis les résultats des quatre rencontres de la semaine 6 en sélectionnant exactement les équipes prévues. Ce déblocage reste local à ton navigateur.</p><form onsubmit="v4Add(event)"><label>Semaine<select name="week">${[6,7,8,9,10].map(w=>`<option value="${w}">${w}</option>`).join('')}</select></label><label>Équipe A<select name="a">${teamNames.map(t=>`<option value="${esc(t)}">${esc(displayTeam(t))}</option>`).join('')}</select></label><label>Équipe B<select name="b">${teamNames.map(t=>`<option value="${esc(t)}">${esc(displayTeam(t))}</option>`).join('')}</select></label><label>Score A (vide = à jouer)<input name="sa" type="number" min="0" class="v4-admininput" placeholder="Non joué"></label><label>Score B (vide = à jouer)<input name="sb" type="number" min="0" class="v4-admininput" placeholder="Non joué"></label><button class="primary" type="submit">Ajouter à ma démo</button></form></div><div class="card"><h2>Rencontres ajoutées localement</h2>${customMatches.map((m,i)=>`<p>S${m.week} · ${esc(displayTeam(m.a))} ${m.sa??'—'} - ${m.sb??'—'} ${esc(displayTeam(m.b))} <button onclick="customMatches.splice(${i},1);saveV4();render()">Supprimer</button></p>`).join('')||'<p>Aucune rencontre ajoutée.</p>'}</div>`;
return ''}
function v4Add(e){e.preventDefault();const f=new FormData(e.target),a=f.get('a'),b=f.get('b'),sa=f.get('sa'),sb=f.get('sb');if(a===b){alert('Choisis deux équipes différentes.');return}if((sa==='')!==(sb==='')){alert('Renseigne les deux scores ou laisse les deux vides.');return}customMatches.push({week:Number(f.get('week')),a,b,sa:sa===''?null:Number(sa),sb:sb===''?null:Number(sb),source:''});saveV4();render()}
</script></body></html>
